<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKEMON TCG SALE - Inventory</title>
    <style>
        :root { 
            --bg-color: #0f111a;
            --surface: #1a1d29;
            --accent: #3b82f6; 
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --price-green: #10b981;
            --sold-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }

        nav {
            padding: 20px 0;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav h1 { font-size: 1.5rem; font-weight: 800; margin: 0; }

        .filter-container {
            background: var(--surface);
            border: 1px solid #2d3142;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .collectr-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 8px;
            border: 1px solid #2d3142;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .collectr-card.sold {
            opacity: 0.6;
            filter: grayscale(0.8);
        }

        .sold-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--sold-red);
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 2;
            text-transform: uppercase;
        }

        .img-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 3/4;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .img-container img { width: 100%; height: auto; }

        .card-meta { padding: 8px 4px; }
        .card-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-set { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .card-price { color: var(--price-green); font-weight: 700; font-size: 0.9rem; }
        .card-stock-badge { font-size: 0.65rem; color: var(--text-dim); background: #333; padding: 2px 6px; border-radius: 4px; }

        #cart-float {
            position: fixed;
            bottom: 25px; right: 25px;
            background: var(--accent);
            color: white;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 100;
            display: none;
            border: none;
        }

        .modal {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            box-sizing: border-box;
        }

        .modal-header { display: flex; gap: 20px; border-bottom: 1px solid #2d3142; padding-bottom: 20px; }
        .modal-img { width: 130px; border-radius: 8px; object-fit: contain; }
        
        .modal-info h2 { margin: 0; font-size: 1.2rem; }
        .modal-price-big { font-size: 1.8rem; color: var(--price-green); font-weight: 800; margin: 10px 0; }
        
        .btn-action {
            display: block; width: 100%; padding: 16px;
            border-radius: 14px; font-weight: 700;
            text-align: center; margin-top: 12px;
            border: none; cursor: pointer; font-size: 1rem;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-add { background: var(--accent); color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-sold { background: #333; color: #666; cursor: not-allowed; pointer-events: none; }

        .close-area { text-align: center; padding-bottom: 15px; color: var(--text-dim); cursor: pointer; }
        
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2d3142; padding: 12px 0;
        }

        .remove-item { color: var(--sold-red); background: none; border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>

    function renderGrid(cardsToRender) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = "";
        cardsToRender.forEach(c => {
            const div = document.createElement('div');
            div.className = `collectr-card ${c.sold ? 'sold' : ''}`;
            
            // Si no hay imagen, muestra un texto amigable
            const imageHtml = c.img ? `<img src="${c.img}" alt="${c.name}">` : `<span>Sin Imagen</span>`;
            
            div.innerHTML = `
                ${c.sold ? '<div class="sold-badge">Vendido</div>' : ''}
                <div class="img-container">${imageHtml}</div>
                <div class="card-meta">
                    <div class="card-set">${c.set}</div>
                    <div class="card-name">${c.name}</div>
                    <div class="card-footer">
                        <div class="card-price">${c.sold ? '---' : '$' + c.price + ' MXN'}</div>
                        <div class="card-stock-badge">x${c.stock}</div>
                    </div>
                </div>
            `;
            div.onclick = () => openDetail(c);
            grid.appendChild(div);
        });
        updateCartUI();
    }

    function handleSort() {
        const filterValue = document.getElementById('sortFilter').value;
        let sortedCards = [...cards];

        if (filterValue === "price-asc") {
            sortedCards.sort((a, b) => a.price - b.price);
        } else if (filterValue === "price-desc") {
            sortedCards.sort((a, b) => b.price - a.price);
        } else if (filterValue === "available") {
            sortedCards = sortedCards.filter(c => !c.sold);
        } else if (filterValue === "sold") {
            sortedCards = sortedCards.filter(c => c.sold);
        }

        renderGrid(sortedCards);
    }
