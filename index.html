<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo de Cartas Pokémon</title>
    <style>
        /* ESTILO INDUSTRIAL / DARK MODE */
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #00e5ff; /* Cyan industrial */
            --text-color: #e0e0e0;
            --border-metal: #444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tarjeta de Carta */
        .pokemon-card {
            background: var(--card-bg);
            border: 1px solid var(--border-metal);
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s ease;
        }

        .pokemon-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
        }

        /* Imagen de Collectr */
        .collectr-img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
            filter: grayscale(20%);
        }

        /* Sección de tus fotos reales */
        .user-photos {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px dashed #555;
            padding-top: 10px;
        }

        .user-photos img {
            width: 45%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #444;
        }

        .price-tag {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: bold;
            margin: 10px 0;
        }

        .btn-contact {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn-contact:hover {
            background: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

<header>
    <h1>Pkm Collector Market</h1>
    <p>Ingeniería en Coleccionismo: Precios actualizados y estado real.</p>
</header>

<div class="inventory-grid">

    <div class="pokemon-card">
        <div class="label">Referencia de Mercado (Collectr)</div>
        <img src="https://images.pokemontcg.io/ex12/145_hires.png" class="collectr-img" alt="Registeel ex">
        
        <h3>Registeel ex #145/217</h3>
        <p>Set: Emerald</p>
        <div class="price-tag">$1,200 MXN</div>

        <div class="label">Mi Carta (Estado Real)</div>
        <div class="user-photos">
            <img src="tu-foto-frente.jpg" alt="Frente Real">
            <img src="tu-foto-trasera.jpg" alt="Trasera Real">
        </div>

        <a href="https://wa.me/TUNUMERO" class="btn-contact">ME INTERESA</a>
    </div>

    </div>

</body>
</html>
