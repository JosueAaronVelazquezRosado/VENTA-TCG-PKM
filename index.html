    <style>
        :root {
            --bg-color: #0f111a;
            --surface: #1a1d29;
            --accent: #3b82f6; 
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --price-green: #10b981;
            --sold-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }

        nav {
            padding: 20px 0;
            max-width: 1000px;
            margin: 0 auto;
        }

        nav h1 { font-size: 1.5rem; font-weight: 800; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .collectr-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 8px;
            border: 1px solid #2d3142;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        /* Estilo para carta vendida en el grid */
        .collectr-card.sold {
            opacity: 0.6;
            filter: grayscale(0.8);
        }

        .sold-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--sold-red);
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 2;
            text-transform: uppercase;
        }

        .img-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 3/4;
            display: flex;
            align-items: center;
        }

        .img-container img { width: 100%; height: auto; }

        .card-meta { padding: 8px 4px; }
        .card-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-set { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .card-price { color: var(--price-green); font-weight: 700; font-size: 0.9rem; }
        .card-stock-badge { font-size: 0.65rem; color: var(--text-dim); background: #333; padding: 2px 6px; border-radius: 4px; }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: flex-end;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            box-sizing: border-box;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; gap: 20px; border-bottom: 1px solid #2d3142; padding-bottom: 20px; }
        .modal-img { width: 130px; border-radius: 8px; }
        
        .modal-info h2 { margin: 0; font-size: 1.2rem; }
        .modal-price-big { font-size: 1.8rem; color: var(--price-green); font-weight: 800; margin: 10px 0; }
        
        .btn-wa {
            background: var(--accent);
            color: white;
            display: block;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 20px;
        }

        /* Botón desactivado */
        .btn-sold {
            background: #333;
            color: #666;
            cursor: not-allowed;
            pointer-events: none;
        }

        .close-area { text-align: center; padding-bottom: 15px; color: var(--text-dim); cursor: pointer; }
        .my-photos img { width: 120px; height: 120px; border-radius: 10px; object-fit: cover; margin-right: 10px; border: 2px solid #2d3142; }
    </style>
</head>

    const grid = document.getElementById('mainGrid');

    function renderGrid() {
        grid.innerHTML = "";
        cards.forEach(c => {

            div.className = `collectr-card ${c.sold ? 'sold' : ''}`;
            div.innerHTML = `
                ${c.sold ? '<div class="sold-badge">Vendido</div>' : ''}
                <div class="img-container"><img src="${c.img}"></div>
                <div class="card-meta">
                    <div class="card-set">${c.set}</div>
                    <div class="card-name">${c.name}</div>
                    <div class="card-footer">
                        <div class="card-price">${c.sold ? '---' : c.price}</div>
                        <div class="card-stock-badge">x${c.stock}</div>
                    </div>
                </div>
            `;
            div.onclick = () => openCard(c);
            grid.appendChild(div);
        });
    }

    function openCard(c) {
        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <div class="modal-header">
                <img src="${c.img}" class="modal-img" style="${c.sold ? 'filter: grayscale(1)' : ''}">
                <div class="modal-info">
                    <div class="card-set">${c.set}</div>
                    <h2>${c.name}</h2>
                    <div class="modal-price-big">${c.sold ? 'AGOTADO' : c.price}</div>
                    <div style="font-size: 0.85rem; color: var(--text-dim)">Disponibles: ${c.stock}</div>
                </div>
            </div>
            
            ${c.sold 
                ? '<div class="btn-wa btn-sold">ESTE ARTÍCULO YA SE VENDIÓ</div>' 
                : `<a href="https://wa.me/${c.wa}?text=Hola! Me interesa la carta ${c.name}" class="btn-wa">Comprar vía WhatsApp</a>`
            }
        `;
        document.getElementById('cardModal').style.display = 'flex';
    }

        document.getElementById('cardModal').style.display = 'none';
