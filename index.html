<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Card Collection</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --surface: #1a1d29;
            --accent: #3b82f6; /* Azul tipo App */
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --price-green: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }

        /* BARRA DE NAVEGACIÓN TIPO APP */
        nav {
            padding: 20px 0;
            text-align: left;
            max-width: 1000px;
            margin: 0 auto;
        }

        nav h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }

        /* GRID DE CARTAS */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columnas en celular */
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* TARJETA ESTILO COLLECTR */
        .collectr-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 8px;
            border: 1px solid #2d3142;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .collectr-card:active { transform: scale(0.97); }

        .img-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 3/4;
            display: flex;
            align-items: center;
        }

        .img-container img { width: 100%; height: auto; }

        .card-meta { padding: 8px 4px; }
        .card-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-set { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; }
        .card-price { color: var(--price-green); font-weight: 700; font-size: 0.9rem; }

        /* MODAL (DETALLE DE LA CARTA) */
        .modal {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: flex-end; /* Abre desde abajo tipo hoja de móvil */
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            box-sizing: border-box;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; gap: 20px; border-bottom: 1px solid #2d3142; padding-bottom: 20px; }
        .modal-img { width: 140px; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        .modal-info h2 { margin: 0; font-size: 1.2rem; }
        .modal-price-big { font-size: 1.8rem; color: var(--price-green); font-weight: 800; margin: 10px 0; }

        .section-title { font-size: 0.75rem; color: var(--text-dim); font-weight: 700; margin: 20px 0 10px; text-transform: uppercase; }

        /* GALERÍA DE TUS FOTOS */
        .my-photos { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .my-photos img { width: 120px; height: 120px; border-radius: 10px; object-fit: cover; border: 2px solid #2d3142; }

        .btn-wa {
            background: var(--accent);
            color: white;
            display: block;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 20px;
        }

        .close-area { text-align: center; padding-bottom: 15px; color: var(--text-dim); cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <h1>My Collection</h1>
</nav>

<div class="card-grid" id="mainGrid"></div>

<div class="modal" id="cardModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="close-area" onclick="closeModal()">✕ Cerrar</div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ESTA ES TU BASE DE DATOS - IGUAL QUE EN COLLECTR
    const cards = [
        {
            id: 1,
            name: "Registeel ex #145/217",
            set: "EX Emerald",
            price: "$1,200.00",
            img: "https://images.pokemontcg.io/ex12/145_hires.png", // Imagen de Collectr/API
            myImages: ["frente_regi.jpg", "vuelta_regi.jpg"], // Tus fotos
            wa: "521234567890"
        },
        {
            id: 2,
            name: "Mega Lucario-EX",
            set: "Furious Fists",
            price: "$450.00",
            img: "https://images.pokemontcg.io/xy3/55_hires.png",
            myImages: ["foto1.jpg"],
            wa: "521234567890"
        }
    ];

    const grid = document.getElementById('mainGrid');

    // Cargar la cuadrícula inicial
    cards.forEach(c => {
        const div = document.createElement('div');
        div.className = 'collectr-card';
        div.innerHTML = `
            <div class="img-container"><img src="${c.img}"></div>
            <div class="card-meta">
                <div class="card-set">${c.set}</div>
                <div class="card-name">${c.name}</div>
                <div class="card-price">${c.price}</div>
            </div>
        `;
        div.onclick = () => openCard(c);
        grid.appendChild(div);
    });

    function openCard(c) {
        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <div class="modal-header">
                <img src="${c.img}" class="modal-img">
                <div class="modal-info">
                    <div class="card-set">${c.set}</div>
                    <h2>${c.name}</h2>
                    <div class="modal-price-big">${c.price}</div>
                    <div style="font-size: 0.8rem; color: #10b981;">+2.4% Market Price</div>
                </div>
            </div>
            
            <div class="section-title">Fotos del vendedor (Estado Real)</div>
            <div class="my-photos">
                ${c.myImages.map(i => `<img src="${i}">`).join('')}
            </div>

            <a href="https://wa.me/${c.wa}?text=Me interesa tu ${c.name}" class="btn-wa">Comprar ahora</a>
        `;
        document.getElementById('cardModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('cardModal').style.display = 'none';
    }
</script>

</body>
</html>
